[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=80",
    "setuptools-scm[simple]>=8"
]

[project]
authors = [
    {email = "tim@cerazone.net", name = "Tim Cera"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: BSD License",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules"
] # Get strings from http://pypi.python.org/pypi?%3Aaction=list_classifiers
dependencies = [
    "docstring_parser",
    "docutils"
]
description = "Python library for creating and manipulating CLIs"
dynamic = ["readme", "version"]
keywords = [
    "argparse",
    "arguments",
    "cli",
    "command line",
    "docstring",
    "keyword arguments",
    "python"
]
license = {text = "BSD-3-Clause and MIT"}
name = "cltoolbox"
requires-python = ">=3.10"

[project.urls]
bitbucket = "https://bitbucket.org/timcera/cltoolbox/src/main/"
documentation = "https://timcera.bitbucket.io/cltoolbox/docs/index.html#cltoolbox-documentation"
github = "https://github.com/timcera/cltoolbox"

[tool]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = true
version = "4.0.2"
version_files = ["VERSION"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE.txt"]

[tool.setuptools.dynamic]
readme = {file = "README.rst"}
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
